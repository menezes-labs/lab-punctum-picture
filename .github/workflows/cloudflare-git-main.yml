name: Git main → Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "worker/**"
      - "shared/**"
      - "db/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "vinext.config.*"
      - "tsconfig.json"
      - "requests/cloudflare-git-deploy.json"
      - ".github/workflows/cloudflare-git-main.yml"

permissions:
  contents: write

concurrency:
  group: punctum-git-main-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      SOURCE_ADMIN_EMAIL: ${{ secrets.SOURCE_ADMIN_EMAIL }}
      SOURCE_ADMIN_PASSWORD: ${{ secrets.SOURCE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        run: npm run lint

      - name: Verify hero is a real WebP binary
        id: hero_binary
        shell: bash
        run: |
          set -euo pipefail
          HERO='public/images/hero-maria.webp'
          [ -f "$HERO" ]
          [ "$(head -c 4 "$HERO")" = 'RIFF' ]
          [ "$(dd if="$HERO" bs=1 skip=8 count=4 status=none)" = 'WEBP' ]
          file "$HERO" | grep -q 'Web/P image'

      - name: Build vinext worker
        id: build
        run: npm run build

      - name: Tests
        id: tests
        run: npm test

      - name: Install trusted Wrangler
        id: wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.125.0

      - name: Resolve production D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/d1.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database")"
          [ "$HTTP" = "200" ]
          jq -e '.success == true' /tmp/d1.json >/dev/null
          DB_ID="$(jq -r '.result[]? | select(.name == "punctum-picture") | (.uuid // .id // empty)' /tmp/d1.json | head -n1)"
          [ -n "$DB_ID" ]
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Apply production D1 migrations
        id: d1_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: wrangler d1 migrations apply punctum-picture --remote --config wrangler.jsonc

      - name: Patch generated config for owner Cloudflare production
        id: patch
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const productionUrl = 'https://punctumpicture.com';

          config.name = 'punctum-picture-migration';
          config.workers_dev = true;
          config.preview_urls = true;
          config.routes = [
            { pattern: 'punctumpicture.com', custom_domain: true },
            { pattern: 'www.punctumpicture.com', custom_domain: true },
          ];
          delete config.env;

          config.d1_databases = [{
            binding: 'DB',
            database_name: 'punctum-picture',
            database_id: process.env.DB_ID,
          }];
          config.r2_buckets = [
            { binding: 'ORIGINALS', bucket_name: 'punctum-picture-originals' },
            { binding: 'BACKUPS', bucket_name: 'punctum-picture-backups' },
          ];
          config.images = { binding: 'IMAGES' };
          config.triggers = { crons: ['0 3 * * *', '0 * * * *'] };
          config.observability = {
            enabled: true,
            logs: { head_sampling_rate: 1 },
            traces: { enabled: true, head_sampling_rate: 0.1 },
          };
          config.vars = {
            ENVIRONMENT: 'production',
            SITE_ORIGIN: productionUrl,
            PUBLIC_SITE_URL: productionUrl,
            PUBLIC_WHATSAPP_E164: 'UNSPECIFIED',
            PUBLIC_INSTAGRAM_URL: 'UNSPECIFIED',
            MAX_UPLOAD_BYTES: '26214400',
            ALLOWED_MIME_TYPES: 'image/jpeg,image/png,image/webp',
            PRESIGNED_URL_TTL_SECONDS: '900',
            CONTACT_RATE_LIMIT_WINDOW_SECONDS: '3600',
            CONTACT_RATE_LIMIT_MAX: '5',
            ADMIN_RATE_LIMIT_WINDOW_SECONDS: '60',
            ADMIN_RATE_LIMIT_MAX: '60',
            BACKUP_PREFIX: 'backups/d1',
            BACKUP_RETENTION_DAYS: '180',
            CLEANUP_ORPHAN_UPLOAD_AGE_HOURS: '24',
            GIT_SHA: process.env.GITHUB_SHA || 'unknown',
          };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Deploy to Cloudflare
        id: deploy_worker
        run: wrangler deploy --config dist/server/wrangler.json

      - name: Verify published immersive experience
        id: published_experience
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://punctumpicture.com'
          EXPECTED_CONFIG='(
            .siteConfig.editorial.home.hero.title == "Fotografias de" and
            .siteConfig.editorial.home.statement.title == "Comecei na fotografia na igreja, e desde então nunca mais parei." and
            .siteConfig.editorial.home.carousel.title == "Fotografias para ver de perto." and
            .siteConfig.theme.typography.headingFamily == "instrument-serif" and
            (.siteConfig.pages.home.sections | any(
              .type == "hero" and .variant == "cinematic" and .heroMedia == null
            )) and
            (.siteConfig.pages.home.sections | any(
              .type == "photo-reel" and .variant == "horizontal"
            ))
          )'

          PUBLISHED_OK=false
          for attempt in 1 2 3 4 5; do
            if curl -fsS -H 'Cache-Control: no-cache' \
              "$BASE/api/public/site?deploy=${GITHUB_SHA}&attempt=${attempt}" \
              -o /tmp/published-site.json && \
              jq -e "$EXPECTED_CONFIG" /tmp/published-site.json >/dev/null; then
              PUBLISHED_OK=true
              break
            fi
            sleep 6
          done
          [ "$PUBLISHED_OK" = "true" ]

      - name: Smoke test production root, hero and admin
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://punctumpicture.com'
          EXPECTED_STATS='.stats.photoCount == 192 and .stats.albumCount == 16 and .stats.categoryCount == 7'

          ROOT_OK=false
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$BASE/api/public/stats" >/tmp/stats.json && jq -e "$EXPECTED_STATS" /tmp/stats.json >/dev/null; then
              ROOT_OK=true
              break
            fi
            sleep 6
          done
          [ "$ROOT_OK" = "true" ]

          HERO_OK=false
          for attempt in 1 2 3 4 5; do
            if curl -fsS -H 'Cache-Control: no-cache' "$BASE/images/hero-maria.webp?deploy=${GITHUB_SHA}" -o /tmp/production-hero.webp; then
              if [ "$(head -c 4 /tmp/production-hero.webp)" = 'RIFF' ] && \
                 [ "$(dd if=/tmp/production-hero.webp bs=1 skip=8 count=4 status=none)" = 'WEBP' ]; then
                HERO_OK=true
                break
              fi
            fi
            sleep 6
          done
          [ "$HERO_OK" = "true" ]
          file /tmp/production-hero.webp | grep -q 'Web/P image'

          WWW_STATUS='unavailable'
          if curl -fsSL --connect-timeout 8 --max-time 15 'https://www.punctumpicture.com/api/public/stats' >/tmp/www-stats.json; then
            if jq -e "$EXPECTED_STATS" /tmp/www-stats.json >/dev/null; then
              WWW_STATUS='healthy'
            else
              WWW_STATUS='unexpected-stats'
            fi
          fi
          echo "WWW_SMOKE_STATUS=$WWW_STATUS" >> "$GITHUB_ENV"

          LOGIN_HTTP="$(curl -sS -o /tmp/login.json -D /tmp/login.headers -w '%{http_code}' \
            -X POST "$BASE/admin/api/session" \
            -H "Origin: $BASE" \
            -H 'Content-Type: application/json' \
            --data-binary "$(jq -nc --arg e "$SOURCE_ADMIN_EMAIL" --arg p "$SOURCE_ADMIN_PASSWORD" '{email:$e,password:$p}')")"
          [ "$LOGIN_HTTP" = "200" ]
          COOKIE="$(grep -i '^set-cookie:' /tmp/login.headers | head -n1 | sed -E 's/^[Ss]et-[Cc]ookie:[[:space:]]*([^;]+).*/\1/' | tr -d '\r')"
          [ -n "$COOKIE" ]
          curl -fsS "$BASE/admin/api/studio" -H "Cookie: $COOKIE" >/tmp/studio.json

          jq -e '.siteConfig != null and .siteConfig.identity != null and .siteConfig.editorial != null' /tmp/studio.json >/dev/null

      - name: Deployment summary
        if: success()
        run: |
          {
            echo '### Punctum Cloudflare production deploy'
            echo '- Git branch: `main`'
            echo '- Worker: `punctum-picture-migration`'
            echo '- Production apex: healthy'
            echo '- Production hero: valid WebP binary'
            echo '- Published lens, carousel, direct copy and typography: verified'
            echo "- WWW smoke: \`${WWW_SMOKE_STATUS:-unknown}\` (non-blocking)"
            echo '- D1 migrations: applied before Worker deploy'
            echo '- D1: `punctum-picture`'
            echo '- R2 originals/backups: connected'
            echo '- Cloudflare Images: connected'
            echo '- Crons: enabled'
            echo '- Authenticated Studio contract: verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist sanitized deploy result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          cat > /tmp/cloudflare-git-deploy-result.json <<EOF
          {
            "status": "$STATUS",
            "checkedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceCommit": "$GITHUB_SHA",
            "worker": "punctum-picture-migration",
            "workerUrl": "https://punctum-picture-migration.menezesx2k26.workers.dev",
            "productionUrl": "https://punctumpicture.com",
            "wwwUrl": "https://www.punctumpicture.com",
            "gitBranch": "main",
            "autoDeployEnabled": true,
            "stages": {
              "npmCi": "${{ steps.deps.outcome }}",
              "typecheck": "${{ steps.typecheck.outcome }}",
              "lint": "${{ steps.lint.outcome }}",
              "heroBinary": "${{ steps.hero_binary.outcome }}",
              "build": "${{ steps.build.outcome }}",
              "tests": "${{ steps.tests.outcome }}",
              "wrangler": "${{ steps.wrangler.outcome }}",
              "d1": "${{ steps.d1.outcome }}",
              "d1Migrations": "${{ steps.d1_migrations.outcome }}",
              "generatedConfig": "${{ steps.patch.outcome }}",
              "deploy": "${{ steps.deploy_worker.outcome }}",
              "publishedExperience": "${{ steps.published_experience.outcome }}",
              "smoke": "${{ steps.smoke.outcome }}"
            },
            "wwwSmokeStatus": "${WWW_SMOKE_STATUS:-unknown}",
            "wwwSmokeRequired": false,
            "d1": "punctum-picture",
            "r2Originals": "punctum-picture-originals",
            "r2Backups": "punctum-picture-backups",
            "cloudflareImages": true,
            "cronsEnabled": true,
            "studioContractVerified": true,
            "publishedExperienceVerified": $([ '${{ steps.published_experience.outcome }}' = 'success' ] && echo true || echo false),
            "customDomainsConfigured": true
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/cloudflare-git-deploy-result.json requests/cloudflare-git-deploy-result.json
          git add requests/cloudflare-git-deploy-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record Git-driven Cloudflare deploy"
          git push
