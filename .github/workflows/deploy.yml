name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Destino do deploy"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      confirm_production:
        description: "Digite DEPLOY_PRODUCTION para liberar production"
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - name: Guard production deploy
        if: inputs.environment == 'production'
        run: |
          if [ "${{ inputs.confirm_production }}" != "DEPLOY_PRODUCTION" ]; then
            echo "Production bloqueada: confirmação explícita ausente."
            exit 1
          fi

  deploy:
    needs: validate-production
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install trusted Wrangler
        run: npm install --global --no-audit --no-fund wrangler@4.131.1
      - name: Deploy preview
        if: inputs.environment == 'preview'
        run: node scripts/private-galleries-preview.mjs
        env:
          PRIVATE_GALLERY_PREVIEW: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      - name: Save sanitized preview report
        if: always() && inputs.environment == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: private-galleries-preview-report
          path: outputs/private-galleries-preview-report.json
          if-no-files-found: ignore
      - name: Deploy production
        if: inputs.environment == 'production'
        run: wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
