name: Temporary Gabriel Ops Cron Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Gabriel Ops
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TEMP_PRIVATE_REPOSITORY }}
          token: ${{ secrets.TEMP_PRIVATE_READ_TOKEN }}
          ref: main
          path: gabriel-ops
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gabriel-ops/package-lock.json
      - name: Install
        working-directory: gabriel-ops
        run: npm ci
      - name: Align GitHub Worker secret
        working-directory: gabriel-ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SYNC_TOKEN: ${{ secrets.TEMP_PRIVATE_READ_TOKEN }}
        shell: bash
        run: printf '%s' "$GITHUB_SYNC_TOKEN" | npx wrangler secret put GITHUB_TOKEN --name gabriel-ops
      - name: Build web
        working-directory: gabriel-ops
        run: npm run build:web
      - name: Deploy Cloudflare cron worker
        working-directory: gabriel-ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Capture GitHub snapshot before cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NS='bf1a8d43e86048ea822af92a744f8ec9'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values/latest%3Agithub" -o /tmp/before.json
          jq -r '.observedAt' /tmp/before.json | tee /tmp/before.txt
      - name: Wait for one Cloudflare cron window
        run: sleep 360
      - name: Prove Cloudflare cron refreshed GitHub snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NS='bf1a8d43e86048ea822af92a744f8ec9'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values/latest%3Agithub" -o /tmp/after.json
          BEFORE="$(cat /tmp/before.txt)"
          AFTER="$(jq -r '.observedAt' /tmp/after.json)"
          [ "$AFTER" != "$BEFORE" ]
          node -e "if (Date.now()-Date.parse(process.argv[1]) > 10*60*1000) process.exit(1)" "$AFTER"
          jq '{source,observedAt,repositoryCount:(.payload.repositories|length)}' /tmp/after.json
