name: Temporary Gabriel Ops Dashboard Token Rotation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rotate dashboard access token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GABRIEL_OPS_TOKEN: ${{ secrets.TEMP_GABRIEL_OPS_DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GABRIEL_OPS_TOKEN" | npx -y wrangler@4.133.0 secret put GABRIEL_OPS_TOKEN --name gabriel-ops
