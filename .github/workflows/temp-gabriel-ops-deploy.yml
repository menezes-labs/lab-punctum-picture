name: Temporary Gabriel Ops Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gabriel Ops
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TEMP_PRIVATE_REPOSITORY }}
          token: ${{ secrets.TEMP_PRIVATE_READ_TOKEN }}
          ref: main
          path: gabriel-ops
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gabriel-ops/package-lock.json
      - name: Install
        working-directory: gabriel-ops
        run: npm ci
      - name: Build web
        working-directory: gabriel-ops
        run: npm run build:web
      - name: Deploy Cloudflare
        working-directory: gabriel-ops
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
