name: Temporary Gabriel Ops Fresh Feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gabriel Ops
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TEMP_PRIVATE_REPOSITORY }}
          token: ${{ secrets.TEMP_PRIVATE_READ_TOKEN }}
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Push fresh operational observation
        env:
          GABRIEL_OPS_URL: https://gabriel-ops.menezesx2k26.workers.dev
          GABRIEL_OPS_INGEST_TOKEN: ${{ secrets.GABRIEL_OPS_INGEST_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { pushProjectFeed } from './scripts/push-project-feed.mjs';
          const observedAt = new Date().toISOString();
          const project = {
            projectId: 'gabriel-ops',
            source: 'executor:gabriel-ops-controller',
            observedAt,
            status: 'active',
            currentTask: 'Production monitoring after Live Project Feed rollout',
            nextAction: { title: 'Keep operational sources fresh via executor/runtime feeds', status: 'ready', blockedBy: [] },
            blockers: [],
            evidence: [
              { type: 'github_pr', source: 'github', identifier: 'menezesx2k26-byte/Gabriel-Ops#7', url: 'https://github.com/menezesx2k26-byte/Gabriel-Ops/pull/7', observedAt },
              { type: 'deployment_status', source: 'cloudflare', identifier: 'gabriel-ops:7d197c24-f097-42f4-90c2-782fba4277e8', observedAt }
            ]
          };
          await pushProjectFeed({ baseUrl: process.env.GABRIEL_OPS_URL, ingestToken: process.env.GABRIEL_OPS_INGEST_TOKEN, payload: { projects: [project] } });
          console.log(JSON.stringify({ projectId: project.projectId, observedAt, currentTask: project.currentTask }));
          NODE
