name: Temporary Gabriel Ops Ingest Secret Sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gabriel Ops
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TEMP_PRIVATE_REPOSITORY }}
          token: ${{ secrets.TEMP_PRIVATE_READ_TOKEN }}
          ref: main
          path: gabriel-ops
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: gabriel-ops
        run: npm ci
      - name: Align ingest secret
        working-directory: gabriel-ops
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GABRIEL_OPS_INGEST_TOKEN: ${{ secrets.GABRIEL_OPS_INGEST_TOKEN }}
        shell: bash
        run: printf '%s' "$GABRIEL_OPS_INGEST_TOKEN" | npx wrangler secret put GABRIEL_OPS_INGEST_TOKEN --name gabriel-ops
