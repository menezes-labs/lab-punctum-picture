name: Temporary Gabriel Ops KV Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Read production project feed KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NS='bf1a8d43e86048ea822af92a744f8ec9'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values/latest%3Aproject-feed" \
            -o /tmp/feed.json
          jq -e '.source == "project-feed" and (.payload.projects | any(.projectId == "gabriel-ops" and .source == "executor:gabriel-ops-controller"))' /tmp/feed.json >/dev/null
          jq '{source, envelopeObservedAt:.observedAt, project:(.payload.projects[] | select(.projectId == "gabriel-ops") | {projectId,source,observedAt,status,currentTask,nextAction,blockers})}' /tmp/feed.json
